schema: 1
project:
  name: fixture
  topology: single
profiles: [core@1]
github:
  merge: squash
evidence:
  publish: sanitized
agents:
  builder:
    runtime: custom
    command: /usr/local/bin/harness
    args: ["--root", "{root}", "--prompt", "{prompt}", "--out", "{output}"]
    env: ["HARNESS_TOKEN", "HARNESS_REGION"]
