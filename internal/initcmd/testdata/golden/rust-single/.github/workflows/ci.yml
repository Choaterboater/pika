name: check
on:
  push:
    branches: [main]
    paths:
      - '.project/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/ci.yml'
      - 'src/**'
      - 'Cargo.toml'
  pull_request:
    paths:
      - '.project/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/ci.yml'
      - 'src/**'
      - 'Cargo.toml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Pin stable Rust
        run: rustup default stable
      - name: Install pika
        run: go install github.com/Choaterboater/pika/cmd/pika@latest
      - name: Verify
        run: pika check --ci
