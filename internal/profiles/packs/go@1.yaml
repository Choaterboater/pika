# Go language profile pack for pika M1 (spec §5.4, §6.1, §6.2).
profile: go
version: "1"

provenance:
  source: embedded
  generated-by: "pika m1-kernel spec §5.4/§6.1"

detection:
  when: "language == go"

layout:
  # Spec §6.1: cmd/ for binaries, internal/ for private packages; pkg/
  # only for intentionally public reusable APIs.
  expectations:
    - "cmd/ for binaries"
    - "internal/ for private packages"
    - "pkg/ only for intentionally public reusable APIs"

templates: []

naming:
  # Core's naming rules apply; the language pack adds none in M1.
  rules: []

verification:
  # Discovery sentinels carry the suggested command for when the
  # repository's own discovery (Makefile, package.json scripts) finds
  # nothing; the resolver keeps them as sentinels, not commands.
  # autofill marks the hints that were measured against a fresh `pika
  # init --profile go` scaffold and run correctly there, so authoring may
  # adopt them into contract.commands unattended.
  checks:
    - id: format
      discovery: true
      autofill: true
      # -l without -w, deliberately: a verification gate must not rewrite
      # the artifact it verifies. `gofmt -l -w .` reformatted the working
      # tree and then exited 0 whatever it had done, so the gate could
      # neither fail nor leave the repository as it found it. `-l` only
      # lists the misformatted files — and still exits 0, which is why
      # this slot needs fail-on-output to read that list as a failure.
      fail-on-output: true
      hint: [gofmt, -l, .]
    - id: lint
      discovery: true
      autofill: true
      hint: [go, vet, ./...]
    - id: typecheck
      discovery: true
      autofill: true
      # -o /dev/null is not a flourish: `go build ./...` links every main
      # package into an executable in the working directory, so running
      # the typecheck gate drops an untracked multi-megabyte binary in the
      # repository root that the next `pika check` then scans and flags.
      # Discarding the output typechecks and links exactly the same.
      hint: [go, build, -o, /dev/null, ./...]
    - id: test
      cmd: [go, test, ./...]
    - id: smoke
      discovery: true

doc-triggers: []

# Stack advice the kernel cannot infer and the harness-neutral skills
# must not hardcode, composed into every generated harness projection
# (spec §9.2). Each line is a consequence of how this pack's gates are
# declared above, so an agent reading the projection learns why a gate
# behaves the way it does instead of discovering it by failing.
agent-guidance:
  - >-
    The typecheck gate builds with `-o /dev/null` on purpose. `go build
    ./...` links every main package into an executable in the working
    directory, so dropping the flag leaves an untracked binary at the
    repository root that the next `pika check` walks and reports.
  - >-
    The format gate is judged on output, not exit status: `gofmt -l .`
    lists every misformatted file and still exits 0. Never make it pass
    by adding `-w`; a verification gate that rewrites the tree it
    verifies can no longer fail.
  - >-
    `go test ./...` compiles every package, including packages that
    contain no test files. A package that does not build fails the test
    gate without a single assertion failing, so read the gate output
    before concluding a test is wrong.
  - >-
    A test that resolves a repository root by walking up from its
    working directory resolves the checkout the suite is running in.
    Pin the root in any test that runs a governed command —
    `t.Chdir(t.TempDir())` in process, an explicit `--root <fixture>`
    for a spawned binary — or the run operates on itself.
  - >-
    Layout is `cmd/` for binaries and `internal/` for private packages.
    `pkg/` is only for an API outside consumers are meant to import;
    putting a private package there publishes it by accident.

migration:
  steps: []

compatibility:
  requires: []

conventions:
  branches:
    types: [feat, fix, docs, refactor, chore]
    format: "{type}/{slug}"
  pull-requests:
    draft-until-checks-pass: true
    merge-strategy: squash
