# Go language profile pack for pika M1 (spec §5.4, §6.1, §6.2).
profile: go
version: "1"

provenance:
  source: embedded
  generated-by: "pika m1-kernel spec §5.4/§6.1"

detection:
  when: "language == go"

layout:
  # Spec §6.1: cmd/ for binaries, internal/ for private packages; pkg/
  # only for intentionally public reusable APIs.
  expectations:
    - "cmd/ for binaries"
    - "internal/ for private packages"
    - "pkg/ only for intentionally public reusable APIs"

templates: []

naming:
  # Core's naming rules apply; the language pack adds none in M1.
  rules: []

verification:
  # Discovery sentinels carry the suggested command for when the
  # repository's own discovery (Makefile, package.json scripts) finds
  # nothing; the resolver keeps them as sentinels, not commands.
  # autofill marks the hints that were measured against a fresh `pika
  # init --profile go` scaffold and run correctly there, so authoring may
  # adopt them into contract.commands unattended.
  checks:
    - id: format
      discovery: true
      autofill: true
      hint: [gofmt, -l, -w, .]
    - id: lint
      discovery: true
      autofill: true
      hint: [go, vet, ./...]
    - id: typecheck
      discovery: true
      autofill: true
      # -o /dev/null is not a flourish: `go build ./...` links every main
      # package into an executable in the working directory, so running
      # the typecheck gate drops an untracked multi-megabyte binary in the
      # repository root that the next `pika check` then scans and flags.
      # Discarding the output typechecks and links exactly the same.
      hint: [go, build, -o, /dev/null, ./...]
    - id: test
      cmd: [go, test, ./...]
    - id: smoke
      discovery: true

doc-triggers: []

agent-guidance: []

migration:
  steps: []

compatibility:
  requires: []

conventions:
  branches:
    types: [feat, fix, docs, refactor, chore]
    format: "{type}/{slug}"
  pull-requests:
    draft-until-checks-pass: true
    merge-strategy: squash
