# Python language profile pack for pika M1 (spec §5.4, §6.1, §6.2).
profile: python
version: "1"

provenance:
  source: embedded
  generated-by: "pika m1-kernel spec §5.4/§6.1"

detection:
  when: "language == python"

layout:
  # Spec §6.1: src/<import-package>/ and tests/, unless an adopted
  # repository has a coherent alternative.
  expectations:
    - "src/<import-package>/ for the import package"
    - "tests/ for the test suite, unless an adopted repository has a coherent alternative"

templates: []

naming:
  # Core's naming rules apply; the language pack adds none in M1.
  rules: []

verification:
  # Discovery sentinels carry the suggested command for when the
  # repository's own discovery (Makefile, pyproject scripts) finds
  # nothing; the resolver keeps them as sentinels, not commands.
  # autofill marks the hints measured against a fresh `pika init
  # --profile python` scaffold: ruff and mypy are single self-contained
  # binaries that need no project configuration, and all three exit 0 on
  # the scaffold as written. CI installs them alongside pytest.
  checks:
    - id: format
      discovery: true
      autofill: true
      # --check, deliberately: a verification gate must not rewrite the
      # artifact it verifies, and `ruff format .` reformatted the working
      # tree and exited 0 whatever it had done. --check reports instead
      # of writing and exits nonzero on drift, so the exit status alone
      # already fails the gate and no fail-on-output is needed here.
      hint: [ruff, format, --check, .]
    - id: lint
      discovery: true
      autofill: true
      hint: [ruff, check, .]
    - id: typecheck
      discovery: true
      autofill: true
      hint: [mypy, .]
    - id: test
      # `pytest`, not `python -m pytest`. Debian, Ubuntu and every
      # distribution that followed PEP 394's later advice ship the
      # interpreter as `python3` only, so `python -m pytest` makes
      # `pika init --profile python` produce a repository that fails its
      # own test gate on the most common Linux host — and doctor scores
      # that an error. `python3 -m pytest` would only move the hole:
      # the python.org installer for Windows creates `python.exe` and no
      # `python3.exe`. pytest's console script is installed by pytest
      # itself on every platform and inside every virtualenv, so it is
      # the one spelling that follows the interpreter instead of naming
      # it. The scaffold uses a src/ layout, where the package must be
      # installed to be importable anyway, so nothing here depends on
      # `python -m`'s habit of putting the working directory on
      # sys.path.
      cmd: [pytest]
    - id: smoke
      discovery: true

doc-triggers: []

agent-guidance: []

migration:
  steps: []

compatibility:
  requires: []

conventions:
  branches:
    types: [feat, fix, docs, refactor, chore]
    format: "{type}/{slug}"
  pull-requests:
    draft-until-checks-pass: true
    merge-strategy: squash
