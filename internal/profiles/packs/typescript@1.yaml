# TypeScript/JavaScript language profile pack for pika M1
# (spec §5.4, §6.1, §6.2).
profile: typescript
version: "1"

provenance:
  source: embedded
  generated-by: "pika m1-kernel spec §5.4/§6.1"

detection:
  when: "language == typescript"

layout:
  # Spec §6.1: src/ for a single package; apps/ and packages/ for a
  # workspace when the chosen package manager supports it.
  expectations:
    - "src/ for a single package"
    - "apps/ and packages/ for a workspace when the chosen package manager supports it"

templates: []

naming:
  # Core's naming rules apply; the language pack adds none in M1.
  rules: []

verification:
  # TypeScript checks live in package.json scripts: every slot stays a
  # discovery sentinel and the hint is the suggested command for when the
  # script is absent.
  #
  # Not one hint is autofillable, and that is the whole point of the
  # flag. `npm` and `npx` are on nearly every developer machine, so a
  # PATH probe says yes to all four — but every one of them delegates
  # somewhere the scaffold does not reach. Measured on a fresh `pika init
  # --profile typescript` (npm 11, node 24, no node_modules):
  #   npm run format  -> exit 1, Missing script: "format"
  #   npm run lint    -> exit 1, Missing script: "lint"
  #   npm test        -> exit 1, no test script
  #   npx tsc --noEmit-> exit 1, fetches the decoy `tsc` package from the
  #                     registry ("This is not the tsc command you are
  #                     looking for"); it needs the network and never
  #                     typechecks, pass or fail.
  # Adopting any of them would ship a repository that fails its own
  # checks the moment it is created. They stay hints: doctor renders them
  # as remediation once the user installs a toolchain and writes the
  # scripts.
  checks:
    - id: format
      discovery: true
      hint: [npm, run, format]
    - id: lint
      discovery: true
      hint: [npm, run, lint]
    - id: typecheck
      discovery: true
      hint: [npx, tsc, --noEmit]
    - id: test
      discovery: true
      hint: [npm, test]
    - id: smoke
      discovery: true

doc-triggers: []

agent-guidance: []

migration:
  steps: []

compatibility:
  requires: []

conventions:
  branches:
    types: [feat, fix, docs, refactor, chore]
    format: "{type}/{slug}"
  pull-requests:
    draft-until-checks-pass: true
    merge-strategy: squash
