# TypeScript/JavaScript language profile pack for pika M1
# (spec §5.4, §6.1, §6.2).
profile: typescript
version: "1"

provenance:
  source: embedded
  generated-by: "pika m1-kernel spec §5.4/§6.1"

detection:
  when: "language == typescript"

layout:
  # Spec §6.1: src/ for a single package; apps/ and packages/ for a
  # workspace when the chosen package manager supports it.
  expectations:
    - "src/ for a single package"
    - "apps/ and packages/ for a workspace when the chosen package manager supports it"

templates: []

naming:
  # Core's naming rules apply; the language pack adds none in M1.
  rules: []

verification:
  # TypeScript checks live in package.json scripts: every slot stays a
  # discovery sentinel and the hint is the suggested command for when the
  # script is absent.
  #
  # Not one hint is autofillable, and that is the whole point of the
  # flag. `npm` is on nearly every developer machine, so a PATH probe
  # says yes to all four — but every one of them delegates to a
  # package.json script the scaffold does not define. Measured on a
  # fresh `pika init --profile typescript` (npm 11, node 24, no
  # node_modules): all four exit 1 with `Missing script: "<name>"`.
  # Adopting any of them would ship a repository that fails its own
  # checks the moment it is created. They stay hints: doctor renders them
  # as remediation once the user installs a toolchain and writes the
  # scripts.
  #
  # typecheck and test are spelled as the script names discovery can
  # actually find and record verbatim (`npm run <script>`), not as a
  # standalone binary invocation. `npx tsc --noEmit` was tried first and
  # discarded: discovery only ever produces `npm run <script>`, never an
  # npx invocation, so no repository's own package.json could ever make
  # that hint match what ran — and un-autofilled, npx fetches a decoy
  # `tsc` package from the registry rather than typechecking anything.
  # `type-check` and `test` are the conventional script names a
  # TypeScript repository's own package.json is likeliest to declare,
  # so a repository that follows either convention is both discovered
  # and exercised by the identical string this pack recommends.
  checks:
    - id: format
      discovery: true
      hint: [npm, run, format]
    - id: lint
      discovery: true
      hint: [npm, run, lint]
    - id: typecheck
      discovery: true
      hint: [npm, run, type-check]
    - id: test
      discovery: true
      hint: [npm, run, test]
    - id: smoke
      discovery: true

doc-triggers: []

agent-guidance: []

migration:
  steps: []

compatibility:
  requires: []

conventions:
  branches:
    types: [feat, fix, docs, refactor, chore]
    format: "{type}/{slug}"
  pull-requests:
    draft-until-checks-pass: true
    merge-strategy: squash
